<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Minigame</title>
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="stylesheet" href="css/game.css?v=6">
</head>
<body style="overflow: hidden; margin: 0; padding: 0; background: var(--bg-void); color: var(--text-primary);">

  <!-- Navigation -->
  <nav class="nav" style="background: transparent; border: none; padding: var(--space-md) var(--space-xl);">
    <a href="index.html" class="nav-logo">
      <span class="first">Samer</span><span class="last">Wael</span><span class="dot">.</span>
    </a>
    <a href="index.html" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.5rem 1rem;">← Back to Home</a>
  </nav>

  <!-- Game Canvas -->
  <canvas id="game-canvas" style="display: block; position: absolute; inset: 0; z-index: 0;"></canvas>

  <!-- HUD -->
  <div class="hud" style="position: absolute; top: 5rem; left: 2rem; z-index: 10; pointer-events: none; display: flex; flex-direction: column; gap: 0.5rem;">
    <div id="hud-speed" class="hud-speed" style="font-size: 2rem; font-family: var(--font-display); font-weight: 800; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">0 km/h</div>
    <div id="hud-position" class="hud-position" style="font-size: 1rem; color: var(--sw-gold);">0%</div>
  </div>

  <div class="track-bar" style="position: absolute; top: 5rem; right: 2rem; width: 6px; height: 300px; background: rgba(255,255,255,0.1); border-radius: var(--radius-full); z-index: 10; overflow: hidden;">
    <div id="track-fill" class="track-fill" style="width: 100%; height: 0%; background: linear-gradient(to bottom, var(--accent-violet), var(--sw-gold)); transition: height 0.1s ease;"></div>
  </div>

  <div class="keyboard-hint" style="position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 0.75rem 1.5rem; border-radius: var(--radius-full); border: 1px solid var(--border-medium); color: var(--text-secondary); font-size: 0.85rem; font-family: var(--font-mono); z-index: 10; pointer-events: none; display: flex; gap: 1.5rem;">
    <span><strong style="color:#fff;">W A S D</strong> Drive</span>
    <span><strong style="color:#fff;">H</strong> Horn</span>
    <span><strong style="color:#fff;">ENTER</strong> Open</span>
  </div>

  <!-- Mobile Joystick -->
  <div class="mobile-controls">
    <div class="mobile-action-btns">
      <button class="mobile-action-btn horn-btn" id="dpad-horn">📯<span>Horn</span></button>
      <button class="mobile-action-btn enter-btn" id="dpad-enter">▶<span>Open</span></button>
    </div>
    <div class="joystick-zone" id="joystick-zone">
      <div class="joystick-base">
        <div class="joystick-knob" id="joystick-knob"></div>
      </div>
    </div>
  </div>

  <!-- Prompt -->
  <div id="enter-prompt" class="enter-prompt" style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: var(--sw-gold); color: #000; padding: 0.75rem 1.5rem; border-radius: var(--radius-full); font-weight: 700; font-size: 1.1rem; z-index: 10; display: none; box-shadow: var(--glow-gold);">
    Press Enter to view <span class="enter-prompt-project"></span>
  </div>

  <!-- Modal Overlay -->
  <div id="project-modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="gm-category-badge badge" style="margin-bottom: var(--space-sm);"></div>
          <h2 class="gm-title modal-title"></h2>
        </div>
        <button id="modal-close-btn" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-accent-line" style="height: 4px; border-radius: 2px; margin-bottom: 1.5rem;"></div>
        <p class="gm-short-desc" style="font-size: 1.1rem; font-weight: 500; color: var(--text-primary); margin-bottom: 0.5rem;"></p>
        <p class="gm-full-desc" style="color: var(--text-secondary); line-height: 1.7;"></p>

        <div class="modal-section" style="margin-top: 2rem;">
          <h3 class="modal-section-title">How It Works</h3>
          <div class="gm-how-list how-it-works-list"></div>
        </div>

        <div class="modal-section gm-code-container" style="margin-top: 2rem;">
          <h3 class="modal-section-title">Code Snippet</h3>
          <div class="gm-code code-snippet"></div>
        </div>

        <div class="modal-section" style="margin-top: 2rem;">
          <h3 class="modal-section-title">Tech Stack</h3>
          <div class="gm-tech-grid tech-stack-grid"></div>
        </div>

        <div class="modal-section" style="margin-top: 1.5rem;">
          <div class="gm-tags-grid tags-grid" style="display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/projects.js?v=6"></script>
  <script src="js/game.js?v=6"></script>
</body>
</html>
